<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#e0e5ec">
<title>e2e · Recall</title>
<link rel="stylesheet" href="../css/styles.css">
<style>
  /* 只用于输出结果，不影响被测组件 */
  #out { white-space: pre-wrap; font: 12px/1.5 monospace; padding: 12px; }
</style>
</head>
<body>

<!-- 与 index.html 完全一致的骨架 -->
<header class="topbar">
  <div class="topbar__inner">
    <button type="button" class="btn btn--ghost" id="btnBack" hidden>返回</button>
    <span class="brand">
      <span class="brand__dot" aria-hidden="true"></span>
      <span class="topbar__title" id="topTitle">Recall</span>
    </span>
    <div class="topbar__actions">
      <button type="button" class="btn btn--ghost" id="btnFinish" hidden>交卷</button>
      <div class="theme-wrap">
        <button type="button" class="btn btn--soft theme-btn" id="btnTheme" data-act="theme"
          aria-haspopup="menu" aria-expanded="false" title="选择主题">跟随</button>
        <div class="menu" id="themeMenu" role="menu" aria-labelledby="btnTheme" hidden></div>
      </div>
    </div>
  </div>
</header>
<main id="app"></main>
<div id="modalRoot"></div>
<pre id="out"></pre>

<script src="../js/data/java.js"></script>
<script src="../js/data/web.js"></script>
<script src="../js/data/changelog.js"></script>
<script src="../js/core/judge.js"></script>
<script src="../js/core/store.js"></script>
<script src="../js/core/theme.js"></script>
<script src="../js/core/scope.js"></script>
<script src="../js/core/session.js"></script>
<script src="../js/core/round.js"></script>
<script src="../js/core/wrongbook.js"></script>
<script src="../js/core/stars.js"></script>
<script src="../js/core/feedback.js"></script>
<script src="../js/core/rich-text.js"></script>
<script src="../js/core/api.js"></script>
<script src="../js/ui/copy.js"></script>
<script src="../js/ui/view-list.js"></script>
<script src="../js/ui/view-start.js"></script>
<script src="../js/ui/view-feedback.js"></script>
<script src="../js/ui/view-quiz.js"></script>
<script src="../js/ui/view-result.js"></script>
<script src="../js/ui/view-records.js"></script>
<script src="../js/ui/view-wrongbook.js"></script>
<script src="../js/ui/view-changelog.js"></script>
<script src="../js/app.js"></script>

<script>
(function () {
  'use strict';

  var lines = [];
  var pass = 0;
  var fail = 0;

  function log(s) { lines.push(s); }
  function ok(name, cond, extra) {
    if (cond) { pass++; log('PASS  ' + name); }
    else { fail++; log('FAIL  ' + name + (extra ? '  <<< ' + extra : '')); }
  }
  function eq(name, actual, expected) {
    var a = JSON.stringify(actual), e = JSON.stringify(expected);
    ok(name, a === e, 'expected ' + e + ', got ' + a);
  }

  function q(sel) { return document.querySelector(sel); }
  function qa(sel) { return Array.prototype.slice.call(document.querySelectorAll(sel)); }
  function click(el) {
    if (!el) return false;
    el.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, view: window }));
    return true;
  }
  function text(sel) { var e = q(sel); return e ? e.textContent.trim() : ''; }
  // 页面正文只取 #app：本文件自身是 <script> 也在 body 里，
  // 直接读 appText() 会把断言文案（脚本源码）当成页面文字，从而假通过。
  function appText() {
    var el = document.getElementById('app');
    return el ? el.textContent : '';
  }
  // 面板 / 确认框的正文在 #modalRoot 里，不在 #app 里
  function panelText() {
    var el = document.getElementById('modalRoot');
    return el ? el.textContent.replace(/\s+/g, ' ') : '';
  }
  // 真实可见性：不能只看 hidden 属性，必须看渲染尺寸
  function visible(el) {
    if (!el) return false;
    var r = el.getBoundingClientRect();
    return r.width > 0 && r.height > 0 && getComputedStyle(el).display !== 'none';
  }

  function meta() { return text('.meta'); }
  function currentIndex() {
    var m = /第 (\d+)\/(\d+) 题/.exec(meta());
    return m ? Number(m[1]) : -1;
  }
  function correctCount() {
    var m = /已答对 (\d+) 道/.exec(meta());
    return m ? Number(m[1]) : -1;
  }
  function goTo(n) {
    var guard = 0;
    while (currentIndex() < n && guard++ < 500) {
      var btn = q('[data-act="next"]');
      if (!btn) break;
      click(btn);
    }
  }
  // 点题库卡片 → 「开始一轮」面板 → 有进行中的一轮时默认「继续」，否则按选定范围开始
  function openBank(key, scopeType) {
    click(q('[data-bank="' + key + '"]'));
    if (!q('[data-scope-type]')) return; // 面板没出现：让后面的断言去报错
    var cont = q('[data-act="continue"]');
    if (!scopeType && cont) {
      click(cont); // 断点续做：等价于点「继续」
      return;
    }
    if (scopeType && scopeType !== 'all') click(q('[data-scope-type="' + scopeType + '"]'));
    var start = q('[data-act="start-round"]');
    if (start && !start.disabled) click(start);
  }
  // 面板里的范围选择器
  function panelOpen() { return !!q('[data-act="start-round"]'); }
  function chooseScope(type) { click(q('[data-scope-type="' + type + '"]')); }
  function chooseChapters(nos) {
    for (var i = 0; i < nos.length; i++) click(q('[data-scope-chapter="' + nos[i] + '"]'));
  }
  function chooseRandom(n) { click(q('[data-scope-n="' + n + '"]')); }
  function startBtn() { return q('[data-act="start-round"]'); }
  function totalOfCurrentRound() {
    var m = /第 \d+\/(\d+) 题/.exec(meta());
    if (m) return Number(m[1]);
    return -1;
  }
  function roundState() {
    var s = window.QuizApp && window.QuizApp.session();
    if (!s) return null;
    return { ids: s.questionIds, total: s.questions.length, scope: s.scope, label: s.scopeLabel() };
  }
  function goBack(n) {
    var guard = 0;
    while (currentIndex() > n && guard++ < 500) {
      var btn = q('[data-act="prev"]');
      if (!btn) break;
      click(btn);
    }
  }
  // meta 行里的第一枚徽标 = 题型徽标（顶部范围徽标也是 .badge，必须限定在 .meta__tags 内）
  function typeBadgeText() {
    var el = q('.meta__tags .badge');
    return el ? el.textContent.trim() : '';
  }

  /* ================= 视觉断言 ================= */
  function shadowPairs(sh) {
    var out = [], re = /(-?\d+)px (-?\d+)px/g, m;
    while ((m = re.exec(sh)) !== null) out.push([Number(m[1]), Number(m[2])]);
    return out;
  }

  function visualChecks() {
    log('--- 视觉规范断言 ---');

    var bodyBg = getComputedStyle(document.body).backgroundColor;
    eq('背景是 #e0e5ec', bodyBg, 'rgb(224, 229, 236)');

    // 没有任何元素是纯白背景
    var white = qa('*').filter(function (el) {
      var bg = getComputedStyle(el).backgroundColor;
      return bg === 'rgb(255, 255, 255)' || bg === 'rgb(0, 0, 0)';
    });
    eq('没有纯白/纯黑背景元素', white.length, 0);

    // 没有渐变
    var grad = qa('*').filter(function (el) {
      return getComputedStyle(el).backgroundImage.indexOf('gradient') >= 0;
    });
    eq('没有渐变背景', grad.length, 0);

    // 没有 ≥2px 的边框
    var thick = qa('*').filter(function (el) {
      var cs = getComputedStyle(el);
      var w = parseFloat(cs.borderTopWidth) || 0;
      var l = parseFloat(cs.borderLeftWidth) || 0;
      return Math.max(w, l) >= 2;
    });
    eq('没有 ≥2px 的粗边框', thick.length, 0);

    // 卡片双影：右下暗影 + 左上亮影（桌面 8px / 移动端 4px 都接受）
    var card = q('.card');
    if (card) {
      var sh = getComputedStyle(card).boxShadow;
      var dark = /rgb\(184, 188, 194\) (\d+)px (\d+)px/.exec(sh);
      var light = /rgb\(255, 255, 255\) (-\d+)px (-\d+)px/.exec(sh);
      ok('卡片暗影在右下（正偏移）', !!dark && Number(dark[1]) > 0 && Number(dark[2]) > 0, sh);
      ok('卡片亮影在左上（负偏移）', !!light && Number(light[1]) < 0 && Number(light[2]) < 0, sh);
      ok('暗影与亮影偏移对称', !!dark && !!light && dark[1] === light[1].slice(1), sh);
    }

    // 选中选项是 inset 凹陷
    var opt = q('.opt');
    if (opt) {
      ok('未选选项是凸起（非 inset）', getComputedStyle(opt).boxShadow.indexOf('inset') === -1);
    }
  }

  function visualChecksSelected() {
    var sel = q('.opt--selected');
    if (sel) {
      var sh = getComputedStyle(sel).boxShadow;
      ok('选中选项是凹陷（inset）', sh.indexOf('inset') !== -1, sh);
      var pairs = shadowPairs(sh);
      ok('选中选项暗影仍为右下', pairs.some(function (p) { return p[0] > 0 && p[1] > 0; }), sh);
      var keyBg = getComputedStyle(q('.opt--selected .opt__key')).backgroundColor;
      eq('选中徽标变强调色', keyBg, 'rgb(109, 93, 252)');
    } else {
      ok('选中选项是凹陷（inset）', false, '找不到 .opt--selected');
    }
  }

  function overflowChecks() {
    log('--- 响应式断言（375px）---');
    // 确保当前在答题页（底部操作区只在答题页存在）
    if (!q('.actionbar')) {
      if (q('[data-bank]')) openBank('java');
    }
    ok('当前在答题页', !!q('.actionbar'));

    var de = document.documentElement;
    ok('页面无横向滚动（scrollWidth <= clientWidth）', de.scrollWidth <= de.clientWidth + 1,
      'scrollWidth=' + de.scrollWidth + ' clientWidth=' + de.clientWidth);
    // 注：真实 375px 视口由 tools/e2e-narrow.html 验证（headless 窗口有最小宽度）

    var btns = qa('.actionbar .btn');
    ok('底部操作区有 3 个按钮', btns.length === 3, 'got ' + btns.length);
    var tooSmall = btns.filter(function (b) { return b.getBoundingClientRect().height < 44; });
    eq('底部按钮高度 ≥44px', tooSmall.length, 0);

    // 选项触控区 ≥44（规范要求 ≥52 更好）
    var opts = qa('.opt');
    var smallOpts = opts.filter(function (o) { return o.getBoundingClientRect().height < 44; });
    eq('选项触控区 ≥44px', smallOpts.length, 0);

    // 底部操作区在视口内且 fixed
    var bar = q('.actionbar');
    if (bar) {
      var r = bar.getBoundingClientRect();
      ok('底部操作区贴在视口底部', Math.abs(r.bottom - window.innerHeight) < 2,
        'bottom=' + r.bottom + ' vh=' + window.innerHeight);
    }

    // 代码块在窄屏下不撑破页面（横向滚动限制在 pre 内部）
    var pre = q('.rich pre');
    if (pre) {
      ok('代码块宽度不超出视口', pre.getBoundingClientRect().width <= window.innerWidth,
        'pre=' + pre.getBoundingClientRect().width + ' vw=' + window.innerWidth);
      ok('代码块可横向滚动', getComputedStyle(pre).overflowX === 'auto', getComputedStyle(pre).overflowX);
    }
  }

  /* ================= 首页（题库列表页）排版 ================= */
  function homeChecks() {
    log('--- 首页：Hero / 分布条 / 三入口 / 页脚 ---');
    var docEl = document.documentElement;
    var narrow = window.innerWidth < 768;

    // H1：桌面 48px、手机 34px，700、行高 1.1、-1px 字距；前半句 --ink、后半句 --accent-ink
    var h1 = q('.hero__title');
    var h1cs = getComputedStyle(h1);
    eq('首页标题文案', h1.textContent.trim(), window.QuizCopy.LIST_TITLE);
    eq('首页 H1 字号（桌面 48 / 手机 34）', h1cs.fontSize, narrow ? '34px' : '48px');
    ok('首页 H1 行高是 1.1 倍', Math.abs(parseFloat(h1cs.lineHeight) / parseFloat(h1cs.fontSize) - 1.1) < 0.02,
      h1cs.lineHeight + ' / ' + h1cs.fontSize);
    eq('首页 H1 字重 700', h1cs.fontWeight, '700');
    ok('首页 H1 字距 -1px', Math.abs(parseFloat(h1cs.letterSpacing) + 1) < 0.1 && /px/.test(h1cs.letterSpacing),
      'letter-spacing=' + h1cs.letterSpacing);
    ok('首页 H1 用 --ink', h1cs.color === appVar('--ink'), h1cs.color);
    ok('标题不换行（单行高度 ≈ 1.1 行高）',
      h1.getBoundingClientRect().height <= parseFloat(h1cs.fontSize) * 1.1 + 2,
      'h=' + h1.getBoundingClientRect().height);

    // 标题拆两段：前半句正文色，后半句 .hero__accent 用强调色，同字号同字重
    var acc = q('.hero__accent');
    ok('标题有强调色后半句（.hero__accent）', !!acc);
    if (acc) {
      var acccs = getComputedStyle(acc);
      eq('后半句文案', acc.textContent.trim(), window.QuizCopy.LIST_TITLE_ACCENT);
      ok('前半句是正文色、后半句不是',
        h1cs.color === appVar('--ink') && acccs.color !== appVar('--ink'),
        h1cs.color + ' / ' + acccs.color);
      ok('后半句用强调色 --accent-ink', acccs.color === appVar('--accent-ink'), acccs.color);
      eq('后半句与前半句同字号', acccs.fontSize, h1cs.fontSize);
      eq('后半句与前半句同字重', acccs.fontWeight, h1cs.fontWeight);
      ok('H1 只有两段文字（前半句直接挂在 h1 上）',
        h1.childNodes[0].nodeType === 3 && h1.childNodes[0].textContent.trim() === window.QuizCopy.LIST_TITLE_HEAD,
        h1.innerHTML.slice(0, 120));
    }

    // Hero 整块不可选中（含标题、短横、副文案、统计胶囊），鼠标不是文本光标
    var heroBox = q('.hero');
    eq('Hero 不可选中', getComputedStyle(heroBox).userSelect, 'none');
    eq('Hero 鼠标不是文本光标', getComputedStyle(heroBox).cursor, 'default');
    eq('标题本身也不可选', getComputedStyle(h1).userSelect, 'none');
    ok('品牌铭牌也不可选', getComputedStyle(q('.brand')).userSelect === 'none',
      getComputedStyle(q('.brand')).userSelect);

    // 首页整页是导航装饰：卡片标题/题数/图例、入口、底部两行、页脚全都不可选，
    // 手机上长按不弹系统「复制 / 全选」菜单（-webkit-touch-callout: none）
    eq('首页整页不可选中', getComputedStyle(q('.page--list')).userSelect, 'none');
    eq('入口行继承不可选中', getComputedStyle(q('.bank-actions')).userSelect, 'none');
    eq('底部行继承不可选中', getComputedStyle(q('.list-rows')).userSelect, 'none');
    // 标题下的强调色短横：32×3、圆角 2、上间距 10、--accent
    var rule = q('.hero__rule');
    var rcs = getComputedStyle(rule), rbox = rule.getBoundingClientRect();
    ok('短横宽 32px', Math.abs(rbox.width - 32) < 0.6, 'w=' + rbox.width);
    ok('短横高 3px', Math.abs(rbox.height - 3) < 0.6, 'h=' + rbox.height);
    eq('短横用强调色', rcs.backgroundColor, 'rgb(109, 93, 252)');
    ok('短横圆角 2px', Math.abs(parseFloat(rcs.borderRadius) - 2) < 0.2, rcs.borderRadius);
    ok('短横上间距 10px', Math.abs(parseFloat(rcs.marginTop) - 10) < 0.6, 'margin-top=' + rcs.marginTop);
    eq('短横没有边框', rcs.borderTopWidth, '0px');

    // 副文案：13px、--ink-2、与短横间距 8px、不带数字与实现细节
    var sub = q('.hero__sub');
    var subcs = getComputedStyle(sub);
    ok('副文案上间距 8px', Math.abs(parseFloat(subcs.marginTop) - 8) < 0.6, 'margin-top=' + subcs.marginTop);
    eq('副文案 13px', subcs.fontSize, '13px');
    ok('副文案用 --ink-2', subcs.color === appInk2(), 'color=' + subcs.color);
    ok('副文案里没有数字', !/\d/.test(sub.textContent), sub.textContent.trim());
    ok('副文案不提浏览器/存储实现',
      !/浏览器|localStorage|本机存储|缓存/i.test(sub.textContent), sub.textContent.trim());
    eq('副文案文案', sub.textContent.trim(), window.QuizCopy.LIST_HINT);

    // 统计胶囊：三个、高 32、padding 0 12、胶囊圆角、凹陷、数字 15/600、标签 12/--ink-3、间距 8
    var pills = qa('.hero__pill');
    eq('统计胶囊有 3 个', pills.length, 3);
    eq('统计胶囊标签', pills.map(function (p) { return p.querySelector('.hero__label').textContent.trim(); }),
      ['已练', '错题', '收藏']);
    var p0 = pills[0] || q('.hero__pill');
    var pcs = getComputedStyle(p0);
    ok('胶囊高度 32px', Math.abs(p0.getBoundingClientRect().height - 32) < 0.6,
      'h=' + p0.getBoundingClientRect().height);
    ok('胶囊左右内边距 12px', Math.abs(parseFloat(pcs.paddingLeft) - 12) < 0.6, pcs.paddingLeft);
    ok('胶囊是胶囊圆角', parseFloat(pcs.borderRadius) >= 32, pcs.borderRadius);
    ok('胶囊是凹陷（box-shadow 含 inset）', pcs.boxShadow.indexOf('inset') !== -1, pcs.boxShadow);
    var numcs = getComputedStyle(p0.querySelector('.hero__num'));
    eq('胶囊数字 15px', numcs.fontSize, '15px');
    eq('胶囊数字字重 600', numcs.fontWeight, '600');
    eq('胶囊标签 12px', getComputedStyle(p0.querySelector('.hero__label')).fontSize, '12px');
    var pillsBox = q('.hero__pills');
    // 窄屏：胶囊在标题下方，上间距 20px；≥1024px 横排到右端，上间距为 0（高度靠底对齐）
    var pillsMT = parseFloat(getComputedStyle(pillsBox).marginTop);
    ok('统计行上间距（窄屏 20px / 宽屏横排 0）',
      window.innerWidth >= 1024 ? Math.abs(pillsMT) < 0.6 : Math.abs(pillsMT - 20) < 0.6,
      'margin-top=' + getComputedStyle(pillsBox).marginTop);
    if (pills.length > 1) {
      var pg = pills[1].getBoundingClientRect().left - pills[0].getBoundingClientRect().right;
      ok('统计胶囊间距 8px', Math.abs(pg - 8) < 0.6, 'gap=' + pg.toFixed(1));
    }

    // 分布条：高 6、三段、段间 2、槽底 --mid、上间距 14
    var bar = q('.dist__bar');
    ok('分布条高 6px', Math.abs(bar.getBoundingClientRect().height - 6) < 0.6,
      'h=' + bar.getBoundingClientRect().height);
    // 注意：两个题库各有一条分布条，下面的 segs 只取第一条（Java），否则会数到 6 段
    var segs = qa('.dist__bar')[0].querySelectorAll('.dist__seg');
    segs = Array.prototype.slice.call(segs);
    eq('分布条三段（单选/多选/判断）', segs.length, 3);
    var tops = segs.map(function (s) { return Math.round(s.getBoundingClientRect().top); });
    eq('分布条三段在同一行', tops.filter(function (t) { return t !== tops[0]; }).length, 0);
    if (segs.length > 1) {
      var sg = segs[1].getBoundingClientRect().left - segs[0].getBoundingClientRect().right;
      ok('分布条段间空隙 2px', Math.abs(sg - 2) < 0.6, 'gap=' + sg.toFixed(1));
    }
    ok('分布条槽底用 --mid', getComputedStyle(bar).backgroundColor === appVar('--mid'),
      getComputedStyle(bar).backgroundColor);
    eq('单选段用强调色', getComputedStyle(segs[0]).backgroundColor, 'rgb(109, 93, 252)');
    eq('多选段用 --ok', getComputedStyle(segs[1]).backgroundColor, appVar('--ok'));
    eq('判断段用 --ink-3', getComputedStyle(segs[2]).backgroundColor, appVar('--ink-3'));
    ok('分布条上间距 14px', Math.abs(parseFloat(getComputedStyle(q('.dist')).marginTop) - 14) < 0.6,
      'margin-top=' + getComputedStyle(q('.dist')).marginTop);

    // 图例：12px --ink-3、上间距 6px、文案带三段数量
    var legend = q('.dist__legend');
    eq('图例 12px', getComputedStyle(legend).fontSize, '12px');
    ok('图例用 --ink-3', getComputedStyle(legend).color === appVar('--ink-3'),
      getComputedStyle(legend).color);
    ok('图例上间距 6px', Math.abs(parseFloat(getComputedStyle(q('.dist')).gap) - 6) < 0.6,
      'gap=' + getComputedStyle(q('.dist')).gap);
    eq('Java 图例文案', q('[data-bank="java"] .dist__legend').textContent.trim(), '单选 192 · 多选 12 · 判断 15');

    // 卡片：padding 用 --pad-card、标题 18/600（比 H1 低一档）、meta 13px
    var card = q('.card--clickable');
    eq('卡片内边距用 --pad-card', getComputedStyle(card).paddingTop, appVar('--pad-card'));
    eq('题库标题 18px', getComputedStyle(card.querySelector('.h2')).fontSize, '18px');
    eq('题库标题字重 600', getComputedStyle(card.querySelector('.h2')).fontWeight, '600');
    ok('标题层级拉得开：H1 至少是卡片标题的 2 倍',
      parseFloat(h1cs.fontSize) / parseFloat(getComputedStyle(card.querySelector('.h2')).fontSize) >= 2,
      h1cs.fontSize + ' vs ' + getComputedStyle(card.querySelector('.h2')).fontSize);

    // 三入口：同一行、高 32、间距 8、胶囊、图标 14px
    var rows = qa('.bank-actions');

    // 375px 预算：无头窗口有最小宽度，量不了真视口（真 375px 的排版由
    // e2e-narrow.html 与截图验收覆盖）。这里把这一行的可用宽临时压到
    // 375 − 2×16 = 343px（手机 --pad-page），断言它绝不横向溢出 —— 放不下就换行。

    ok('左图标与右箭头对称留白（左 14px）',

    ok('底部行之间间距 8px',

    eq('反馈箱那行保留计数文案', lr.textContent.trim(), window.QuizCopy.FB_BOX_ENTRY(0));
    eq('第二行是维护日志', lrows[1].textContent.trim(), window.QuizCopy.CHANGELOG_ENTRY);
    ok('底部行文字左对齐（有伸缩的中间文字块）',

  /** 宽屏（≥1024px）首页：容器 960、双栏卡片、Hero 左右分布。
      窄窗口（无头 Chrome 默认 1440 之外的情况）走另一套断言：单列 + 760 容器。
      临时改 `--content-w` 之类的做法行不通 —— 这里直接量当前视口下的真实排版。 */
  function wideChecks() {
    log('--- 首页宽屏（≥1024px 双栏 / 以下单列）---');
    var docEl = document.documentElement;
    var wide = window.innerWidth >= 1024;
    var page = q('.page--list');
    var pageR = page.getBoundingClientRect();
    var cards = qa('[data-bank]');
    var r0 = cards[0].getBoundingClientRect();
    var r1 = cards[1].getBoundingClientRect();
    var heroEl = q('.hero');
    var titleR = q('.hero__title').getBoundingClientRect();
    var pillsR = q('.hero__pills').getBoundingClientRect();
    var note = q('.bank-note');
    var actions = q('.bank-actions');
    var btnsArr = Array.prototype.slice.call(actions.querySelectorAll('.btn--mini'));

    /* 两种宽度下断言「条数」必须一致：README 里记的是唯一一个数字，
       如果宽/窄分支条数不同，换台机器跑出来的数就对不上了。
       所以这里每条断言都同时跑，只是期望值按断点取。 */
    ok('首页根节点带 page--wide', page.classList.contains('page--wide'), page.className);
    eq('page--wide 只出现在首页（列表页只有一处）', qa('.page--wide').length, 1);
    ok('宽屏容器 960 / 窄屏不超过视口',
      wide ? Math.abs(pageR.width - 960) < 1 : pageR.width <= docEl.clientWidth + 1,
      'w=' + pageR.width.toFixed(1) + ' vw=' + docEl.clientWidth);
    ok('容器水平居中',
      Math.abs(pageR.left - (docEl.clientWidth - pageR.width) / 2) < 1.5,
      'left=' + pageR.left.toFixed(1));
    // 同一行 / 上下排
    ok(wide ? '宽屏两卡在同一行' : '窄屏两卡上下排（不同行）',
      wide ? Math.abs(r0.top - r1.top) < 0.6 : Math.abs(r0.top - r1.top) > 1,
      'top=' + r0.top.toFixed(1) + '/' + r1.top.toFixed(1));
    ok(wide ? '宽屏卡片宽 ≥430px' : '窄屏卡片不超过容器宽',
      wide ? r0.width >= 430 && r1.width >= 430 : r0.width <= pageR.width + 0.5,
      r0.width.toFixed(1) + ' / ' + r1.width.toFixed(1));
    ok(wide ? '宽屏第二张在第一张右边' : '窄屏第二张在第一张下边',
      wide ? r1.left > r0.right : r1.top > r0.bottom,
      'r1.left=' + r1.left.toFixed(1) + ' r0.right=' + r0.right.toFixed(1) +
      ' r1.top=' + r1.top.toFixed(1));
    ok(wide ? '宽屏两栏间隙 20px' : '窄屏两张卡片间距 ≥14px',
      wide ? Math.abs(r1.left - r0.right - 20) < 1.2 : (r1.top - r0.bottom) >= 14,
      wide ? 'gap=' + (r1.left - r0.right).toFixed(1) : 'gap=' + (r1.top - r0.bottom).toFixed(1));
    ok('一行三入口不换行（两种宽度都要）',
      btnsArr.length === 3 && btnsArr.every(function (b) {
        return Math.abs(b.getBoundingClientRect().top - btnsArr[0].getBoundingClientRect().top) < 1;
      }),
      btnsArr.map(function (b) { return Math.round(b.getBoundingClientRect().top); }).join(','));
    ok('三入口不溢出所在列', actions.scrollWidth <= actions.clientWidth + 1,
      'sw=' + actions.scrollWidth + ' cw=' + actions.clientWidth);
    ok(wide ? '宽屏双栏隐藏「还没有错题」小字' : '窄屏保留「还没有错题」小字',
      !note || (wide ? getComputedStyle(note).display === 'none'
        : getComputedStyle(note).display !== 'none'),
      note ? getComputedStyle(note).display : '没有 note 元素');
    eq(wide ? '宽屏 Hero 是 flex 横排' : '窄屏 Hero 是上下排',
      getComputedStyle(heroEl).display, wide ? 'flex' : 'block');
    ok(wide ? '宽屏胶囊在标题右边' : '窄屏胶囊在标题下边',
      wide ? pillsR.left > titleR.right : pillsR.top > titleR.bottom,
      'pills.left=' + pillsR.left.toFixed(1) + ' title.right=' + titleR.right.toFixed(1));
    // 容器有左右内边距（--pad-page），对齐要比「内容边缘」而不是边框边缘
    var pagePad = parseFloat(getComputedStyle(page).paddingRight);
    var contentRight = pageR.right - pagePad;
    var contentLeft = pageR.left + pagePad;
    ok(wide ? '宽屏胶囊右端贴容器内容右缘' : '窄屏胶囊左端贴容器内容左缘',
      wide ? Math.abs(pillsR.right - contentRight) < 1.5 : Math.abs(pillsR.left - contentLeft) < 1.5,
      'pills.right=' + pillsR.right.toFixed(1) + ' content.right=' + contentRight.toFixed(1) +
      ' pad=' + pagePad);
    ok('首页无横向滚动', docEl.scrollWidth <= docEl.clientWidth + 1,
      'sw=' + docEl.scrollWidth + ' cw=' + docEl.clientWidth);
  }

  /** 顶栏必须和内容左右对齐：宽屏首页 960（站名贴 H1、主题按钮贴卡片右缘），
      其余视图 760，与各自内容对齐。量「内容边缘」= 容器外框 ∓ 内边距。 */
  function topbarAlign(withTitle) {
    log('--- 顶栏与内容对齐 ---');
    var inner = q('.topbar__inner');
    var page = q('.page');
    var pageR = page.getBoundingClientRect();
    var innerR = inner.getBoundingClientRect();
    var pad = parseFloat(getComputedStyle(page).paddingRight);
    var contentLeft = pageR.left + pad;
    var contentRight = pageR.right - pad;
    var themeR = q('#btnTheme').getBoundingClientRect();
    eq('顶栏与内容同宽（' + Math.round(pageR.width) + 'px）', Math.round(innerR.width), Math.round(pageR.width));
    ok('顶栏与内容同一条左边线', Math.abs(innerR.left - pageR.left) < 1,
      'inner.left=' + innerR.left.toFixed(1) + ' page.left=' + pageR.left.toFixed(1));
    ok('主题按钮与内容右缘对齐', Math.abs(themeR.right - contentRight) < 1,
      'btn.right=' + themeR.right.toFixed(1) + ' content.right=' + contentRight.toFixed(1));
    if (withTitle) {
      // 列表页没有「返回」，站名就是最左那个
      var brandR = q('.brand').getBoundingClientRect();
      ok('站名铭牌与内容左缘对齐', Math.abs(brandR.left - contentLeft) < 1,
        'brand.left=' + brandR.left.toFixed(1) + ' content.left=' + contentLeft.toFixed(1));
      var h1R = q('.hero__title').getBoundingClientRect();
      ok('站名铭牌与 H1 左缘对齐（相差 ≤1px）', Math.abs(brandR.left - h1R.left) < 1,
        'brand.left=' + brandR.left.toFixed(1) + ' h1.left=' + h1R.left.toFixed(1));
      // 双栏时取最靠右那张卡（第一张的右缘在页面中间）
      var cardsArr = qa('[data-bank]');
      var cardRight = Math.max.apply(null, cardsArr.map(function (c) { return c.getBoundingClientRect().right; }));
      ok('主题按钮与卡片右缘对齐（相差 ≤1px）', Math.abs(themeR.right - cardRight) < 1,
        'btn.right=' + themeR.right.toFixed(1) + ' card.right=' + cardRight.toFixed(1));
    } else {
      // 其它视图最左是「返回」，它才是贴内容左缘的那个
      var backR = q('#btnBack').getBoundingClientRect();
      ok('返回按钮与内容左缘对齐', Math.abs(backR.left - contentLeft) < 1,
        'back.left=' + backR.left.toFixed(1) + ' content.left=' + contentLeft.toFixed(1));
    }
    ok('对齐后页面无横向滚动', document.documentElement.scrollWidth <= document.documentElement.clientWidth + 1,
      'sw=' + document.documentElement.scrollWidth + ' cw=' + document.documentElement.clientWidth);
  }

  /** 读 :root 上的设计令牌（用来断言「用的是变量」而不是写死颜色）。
      令牌是十六进制，computedStyle 给的是 rgb()，这里统一转成 rgb() 再比。 */
  function appVar(name) {
    var v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    var m = /^#([0-9a-f]{6})$/i.exec(v);
    if (!m) return v;
    var n = parseInt(m[1], 16);
    return 'rgb(' + ((n >> 16) & 255) + ', ' + ((n >> 8) & 255) + ', ' + (n & 255) + ')';
  }

  function appInk2() {
    return appVar('--ink-2');
  }

  /* 底部行的箭头颜色：悬停规则的箭头是后代选择器，只能临时加类量一次 */
  function hoverArrowColor(row) {
    row.classList.add('state-hover');
    var c = getComputedStyle(row.querySelector('.row-arrow')).color;
    row.classList.remove('state-hover');
    return c;
  }

  /* ================= 主流程 ================= */
  function runFlow() {
    log('--- 题库列表 ---');
    var cards = qa('[data-bank]');
    eq('列表页有 2 个题库', cards.length, 2);
    ok('列表页显示 Java 题库', appText().indexOf('Java程序设计题库') >= 0);
    ok('列表页显示 Web 题库', appText().indexOf('Web前端题库') >= 0);
    ok('列表页标题正确', text('.h1') === window.QuizCopy.LIST_TITLE);

    // 卡片排版：标题一行、题数一行（曾经用 .stack 的 margin-top 给行内 span「假装有间距」）
    (function () {
      var body = q('[data-bank="java"] .stack');
      if (!body) { ok('卡片：找到文字区', false); return; }
      var t = body.children[0];
      var m = body.children[1];
      var badge = q('[data-bank="java"] .badge');
      var rt = t.getBoundingClientRect();
      var rm = m.getBoundingClientRect();
      ok('卡片：题数那行在标题下方（meta.top ≥ title.bottom）', rm.top >= rt.bottom - 0.5,
        'title.bottom=' + rt.bottom.toFixed(1) + ' meta.top=' + rm.top.toFixed(1));
      ok('卡片：两行之间真有间隙（≥2px）', rm.top - rt.bottom >= 2, 'gap=' + (rm.top - rt.bottom).toFixed(1));
      eq('卡片：文字区是竖排 flex', getComputedStyle(body).flexDirection, 'column');
      eq('卡片：标题单行不换行', getComputedStyle(t).whiteSpace, 'nowrap');
      ok('卡片：标题不撑破文字区（省略号生效）', rt.width <= body.getBoundingClientRect().width + 0.5,
        'title=' + rt.width.toFixed(1) + ' body=' + body.getBoundingClientRect().width.toFixed(1));
      ok('卡片：标题与右侧徽标不重叠', rt.right <= badge.getBoundingClientRect().left,
        'title.right=' + rt.right.toFixed(1) + ' badge.left=' + badge.getBoundingClientRect().left.toFixed(1));
    })();
    ok('列表页不显示交卷按钮', !visible(q('#btnFinish')),
      'hidden=' + q('#btnFinish').hidden + ' display=' + getComputedStyle(q('#btnFinish')).display);

    log('--- 顶栏：站名铭牌 + 夜间按钮 ---');
    (function () {
      var brandBox = cssProp('.brand', 'boxShadow');
      ok('站名是凹陷铭牌（box-shadow 含 inset）', /inset/.test(brandBox), brandBox);
      ok('站名不可点（没有 cursor:pointer）', cssProp('.brand', 'cursor') !== 'pointer',
        'cursor=' + cssProp('.brand', 'cursor'));
      ok('品牌圆点用强调色', cssProp('.brand__dot', 'backgroundColor') === 'rgb(109, 93, 252)',
        'dot=' + cssProp('.brand__dot', 'backgroundColor'));
      var themeBox = cssProp('#btnTheme', 'boxShadow');
      ok('夜间按钮是凸起按钮（不含 inset，也不是 none）',
        themeBox !== 'none' && themeBox.indexOf('inset') < 0, themeBox);
      ok('375px 顶栏放得下（scrollWidth <= clientWidth）', topbarFitsAt(375));
    })();

    // 间距按「阴影占位」：卡片自带 8px 外阴影，间距太小会视觉上贴在一起
    (function () {
      var c1r = qa('[data-bank]')[0].getBoundingClientRect();
      var c2r = qa('[data-bank]')[1].getBoundingClientRect();
      var wide = window.innerWidth >= 1024;
      if (wide) {
        // ≥1024px：两栏并排，比的是左右间隙（20px）而不是上下
        var hgap = c2r.left - c1r.right;
        ok('列表页：两栏卡片左右间隙 ≥ 14px', hgap >= 14, 'hgap=' + hgap.toFixed(1));
      } else {
        var gap = c2r.top - c1r.bottom;
        ok('列表页：两张卡片之间的间距 ≥ 14px', gap >= 14, 'gap=' + gap.toFixed(1));
      }
      var hint = q('.page-head p').getBoundingClientRect();
      var lead = qa('[data-bank]')[0].getBoundingClientRect().top - hint.bottom;
      // 说明行到首卡的间距按断点不同（桌面 28px / 手机 20px），这里各用各的下限，
      // 免得在窄窗口里跑这套断言时被误判为 FAIL。
      var leadFloor = window.innerWidth < 768 ? 18 : 24;
      ok('列表页：说明行与第一张卡片之间 ≥ 24px', lead >= leadFloor,
        'lead=' + lead.toFixed(1) + ' floor=' + leadFloor + ' vw=' + window.innerWidth);
    })();

    wideChecks();

    topbarAlign(true);

    homeChecks();

    visualChecks();

    log('--- 进入 Java 答题页 ---');
    openBank('java');
    ok('进入答题页', currentIndex() === 1, meta());
    ok('顶部标题是题库名', text('#topTitle') === 'Java程序设计题库');
    ok('答题页显示交卷按钮', visible(q('#btnFinish')));

    // 答题页顶栏不跟着放宽：1280px 下仍是 760，与题卡左右对齐
    topbarAlign(false);
    eq('第 1 题有 4 个选项', qa('[data-opt]').length, 4);
    ok('题干非空', q('.rich').textContent.trim().length > 0);

    // 反向：真正有信息量的文字仍然可选（Hero 的 user-select:none 不许漏到内容上）
    eq('题干仍可选中', getComputedStyle(q('.rich')).userSelect, 'text');
    eq('选项文字仍可选中', getComputedStyle(q('[data-opt] .opt__body')).userSelect, 'text');
    ok('答题页没有被首页的不可选中规则漏到',

  /* ================= 题型徽标：元素存在还不够，文字必须正确 ================= */

  var TYPE_ALL = ['single', 'multiple', 'judge'];

  // 任何位置（答题页 / 结果页）都回到题库列表

  // 逐题走完整套题库，读每一题卡片上的题型徽标
  function sweepBadges(bankKey, data) {
    openBank(bankKey);
    ok(bankKey + '：已打开答题页', !!q('.chips'), '找不到 .chips');
    goBack(1);

    var bad = [];
    var textCount = {};
    var typeOk = {};
    for (var i = 0; i < data.questions.length; i++) {
      var type = data.questions[i].type;
      var want = TYPE_CN[type] || '（未知题型 ' + type + '）';
      var got = typeBadgeText();
      textCount[got] = (textCount[got] || 0) + 1;
      if (got === want) typeOk[type] = (typeOk[type] || 0) + 1;
      else bad.push('第 ' + (i + 1) + ' 题期望「' + want + '」，实际「' + got + '」');
      var next = q('[data-act="next"]');
      if (next) click(next);
    }
    return { bad: bad, textCount: textCount, typeOk: typeOk };
  }

  function runTypeBadgeChecks() {
    log('--- 题型徽标（全量扫描） ---');
    [['java', window.JAVA_BANK], ['web', window.WEB_BANK]].forEach(function (pair) {
      backToList();
      var r = sweepBadges(pair[0], pair[1]);
      var label = pair[1].title + ' 题型徽标';

      ok(label + '文字只出现三种题型名', Object.keys(r.textCount).every(function (t) {
        return TYPE_ALL.some(function (k) { return TYPE_CN[k] === t; });

        return '「' + t + '」×' + r.textCount[t];

  /* ================= 重练：从某一轮的错题派生新的一轮 ================= */
  var E2E_REPLAY_KEY = 'quiz:e2e:replay';

  function roundsOf(bankKey) {
    try {
      var raw = localStorage.getItem('quiz:rounds:' + bankKey);
      if (!raw) return [];
      var d = JSON.parse(raw);
      return (d && d.rounds) || [];
    } catch (e) { return []; }
  }
  function totalCount() {
    var m = /第 (\d+)\/(\d+) 题/.exec(meta());
    return m ? Number(m[2]) : -1;
  }
  function optionKeys() {
    return qa('[data-opt]').map(function (e) { return e.getAttribute('data-opt'); });
  }
  // 当前题的原始数据（重练轮的题序与原轮不同，必须按题取答案，不能按下标）
  function currentData() {
    return window.QuizApp.session().question;
  }
  function pickKeys(keys) {
    keys.forEach(function (k) { click(q('[data-opt="' + k + '"]')); });
  }
  function pickCorrect() {
    // 数据异常题（scorable:false）没有答案：跳过，别让断言自己崩掉
    var ans = currentData().answer || [];
    if (!ans.length) return false;
    pickKeys(ans.slice());
    return true;
  }
  // 往后找一道数据正常的题并选中正确答案（数据异常题直接跳过）。
  // 随机抽到的 10 题里可能含 answer 为 null 的异常题，那时 pickCorrect 什么都点不了，
  // 断言会从「1 对」掉成「0 对」——这类地方必须用它而不是裸的 pickCorrect。
  function pickCorrectSkippingInvalid() {
    var ans = currentData().answer || [];
    if (ans.length) { pickCorrect(); return true; }
    var guard = 0;
    while (guard++ < 8) {
      var next = q('[data-act="next"]');
      if (!next || next.disabled) break;
      click(next);
      if ((currentData().answer || []).length) { pickCorrect(); return true; }
    }
    return false;
  }
  function pickWrong() {
    var ans = currentData().answer;
    var keys = optionKeys();
    for (var i = 0; i < keys.length; i++) {
      if (ans.indexOf(keys[i]) < 0) { click(q('[data-opt="' + keys[i] + '"]')); return keys[i]; }
    }
    return null;
  }
  // 往后找一道答得错的正常题并提交（数据异常题直接跳过）
  function pickWrongSkippingInvalid() {
    var guard = 0;
    var key = pickWrong();
    while (!key && guard++ < 8) {
      var next = q('[data-act="next"]');
      if (!next || next.disabled) break;
      click(next);
      if (!(currentData().answer || []).length) continue;
      key = pickWrong();
    }
    if (key) submitNow();
    return key;
  }
  function submitNow() { click(q('[data-act="submit"]')); }
  function finishNow() {
    click(q('#btnFinish'));
    if (q('[data-modal-confirm]')) click(q('[data-modal-confirm]'));
  }
  // 答对当前题并提交；万一当前是数据异常题（没选项没答案）就往后找一道正常题
  function answerOne() {
    var guard = 0;
    while (guard++ < 8) {
      var ans = currentData().answer || [];
      if (ans.length) break;
      var next = q('[data-act="next"]');
      if (!next || next.disabled) break;
      click(next);
    }
    pickCorrect();
    submitNow();
  }

      pick('[data-accuracy]'),

  /* ================= 错题本 + 错题练习 ================= */
  function wbEntry(key) { return q('[data-wrongbook="' + key + '"]'); }
  function wbRows() { return qa('.wb-row'); }
  function wbRowTexts() {
    return wbRows().map(function (r) { return r.textContent.replace(/\s+/g, ' ').trim(); });
  }
  function questionById(id) {
    var all = window.WEB_BANK.questions;
    for (var i = 0; i < all.length; i++) if (String(all[i].id) === String(id)) return all[i];
    return null;
  }
  // 章节号 → 章节对象（分组标题要用它）
  function questionByNo(no) {
    var chs = window.WEB_BANK.chapters;
    for (var i = 0; i < chs.length; i++) if (Number(chs[i].no) === Number(no)) return chs[i];
    return { no: no, title: String(no) };
  }
  // 期望顺序：章节号升序 → 题号升序（口径写在 js/core/wrongbook.js）
  function expectedWrongOrder(ids) {
    return ids.slice().sort(function (a, b) {
      var qa = questionById(a), qb = questionById(b);
      if (qa.chapter !== qb.chapter) return Number(qa.chapter) - Number(qb.chapter);
      return Number(qa.id) - Number(qb.id);
    });
  }
  // 只用「已提交且判错」这一条口径重算一轮的错题（与页面无关，独立核对）
  function wrongIdsOf(snap) {
    var qs = (snap.questionIds || []).map(questionById).filter(Boolean);
    return window.QuizSession.createModel(qs, snap.answers || {}).wrongIds();
  }

  // 回到列表再清存储：先清再返回，backToList() 里的「交卷」会往清单里追加一份快照，把期望数搞乱
  function resetQuizStorageFromList() {
    if (q('#btnBack') && !q('#btnBack').hidden) click(q('#btnBack'));
    var guard = 0;
    while (text('.h1') !== window.QuizCopy.LIST_TITLE && q('[data-act="back"]') && guard++ < 5) {
      click(q('[data-act="back"]'));
    }
    clearQuizStorage();
    return text('.h1');
  }

  /* ================= 首页「最近练习」 ================= */
  // 两个题库的已完成快照合并后按 finishedAt 倒序取前 3 条（与 app.js 的 recentRounds 同口径）
  function expectedRecentRows() {
    var out = [];
    ['java', 'web'].forEach(function (k) {
      roundsOf(k).forEach(function (s) {
        out.push({ key: 'round:' + s.id, bankKey: k, finishedAt: s.finishedAt || '', stats: s.stats || {} });
      });
    });
    out.sort(function (a, b) {
      if (a.finishedAt === b.finishedAt) return 0;
      return a.finishedAt < b.finishedAt ? 1 : -1;
    });
    return out.slice(0, 3);
  }

  /* ================= 悬停：只收紧一档 ================= */
  /* file:// 是不透明源：读不到 document.styleSheets[0].cssRules，
     getComputedStyle(el, ':hover') 恒为空串，也没有真实指针。
     所以量 :hover 走「镜像类」——CSS 里把 :hover 与 .state-hover 写进同一条规则，
     量到的就是悬停真正生效的那组声明。 */
  var SH_HOVER_LIGHT = 'rgb(184, 188, 194) 6px 6px 12px 0px, rgb(255, 255, 255) -6px -6px 12px 0px';
  var SH_HOVER_DARK = 'rgb(33, 36, 41) 6px 6px 12px 0px, rgb(63, 69, 78) -6px -6px 12px 0px';
  var SH_SM_LIGHT = 'rgb(184, 188, 194) 4px 4px 8px 0px, rgb(255, 255, 255) -4px -4px 8px 0px';
  var SH_SM_DARK = 'rgb(33, 36, 41) 4px 4px 8px 0px, rgb(63, 69, 78) -4px -4px 8px 0px';
  // 32px 高的一行入口（练习记录 / 错题本 / 收藏练习）再掉一小档：4/8 → 3/6
  var SH_XS_LIGHT = 'rgb(184, 188, 194) 3px 3px 6px 0px, rgb(255, 255, 255) -3px -3px 6px 0px';
  var SH_XS_DARK = 'rgb(33, 36, 41) 3px 3px 6px 0px, rgb(63, 69, 78) -3px -3px 6px 0px';

  function rectOf(el) {
    var r = el.getBoundingClientRect();
    return [r.left, r.top, r.width, r.height, r.right, r.bottom].join('/');
  }

  function hoverSnap(el) {
    var cs = getComputedStyle(el);
    return {
      rect: rectOf(el),
      shadow: cs.boxShadow,
      bg: cs.backgroundColor,
      color: cs.color,
      radius: cs.borderRadius,
      transform: cs.transform
    };
  }

  // 加上镜像类量一次，量完立刻摘掉（不留在页面上影响后面的断言）
  function hoverMeasure(el) {
    if (!el) return null;
    var before = hoverSnap(el);
    el.classList.add('state-hover');
    var after = hoverSnap(el);
    el.classList.remove('state-hover');
    return { before: before, after: after };
  }

  // 一个元素一组：阴影值写死 + 位置/底色/字色/圆角/transform 全不变
  function hoverChecks(name, el, expectShadow) {
    var h = hoverMeasure(el);
    if (!h) { ok(name + '：找得到元素', false, '元素不存在'); return; }
    eq(name + '：悬停阴影是写死的这一档', h.after.shadow, expectShadow);
    eq(name + '：悬停不动位置与尺寸', h.after.rect, h.before.rect);
    eq(name + '：悬停不改底色', h.after.bg, h.before.bg);
    eq(name + '：悬停不改文字色', h.after.color, h.before.color);
    eq(name + '：悬停不改圆角', h.after.radius, h.before.radius);
    eq(name + '：悬停不加 transform', h.after.transform, 'none');
  }

    (function () {
      var dm = hoverMeasure(q('.btn--mini:not([disabled])'));
      eq('深色下一行入口悬停阴影 3/6 档', dm.after.shadow, SH_XS_DARK);
      eq('深色下一行入口悬停浮出 --bg-2 淡底', dm.after.bg, appVar('--bg-2'));
      ok('深色下 --bg-2 与 --bg 确实有差（看得出底色变化）',
        appVar('--bg-2') !== appVar('--bg'), appVar('--bg') + ' vs ' + appVar('--bg-2'));
    })();
    window.QuizTheme.apply(window.QuizTheme.save('light'));
    eq('测完深色回到亮色', document.documentElement.getAttribute('data-theme'), 'light');

    // 首页三入口是「导航型」元素：悬停浮出 --bg-2 淡底 + 字色变深到 --ink，
    // 阴影再从 4/8 收到 3/6；位置、尺寸、圆角一律不动（小控件不跟着变大）。
    var mini = q('.btn--mini:not([disabled])');
    if (mini) {
      var mh = hoverMeasure(mini);
      eq('一行入口悬停阴影 3/6 档', mh.after.shadow, SH_XS_LIGHT);
      eq('一行入口悬停不位移', mh.after.rect, mh.before.rect);
      eq('一行入口悬停浮出 --bg-2 淡底', mh.after.bg, appVar('--bg-2'));
      ok('一行入口默认底色是透明的', mh.before.bg === 'rgba(0, 0, 0, 0)', mh.before.bg);
      eq('一行入口悬停不改圆角', mh.after.radius, mh.before.radius);
      ok('一行入口悬停文字变深到 --ink', mh.after.color === appVar('--ink'),
        mh.before.color + ' → ' + mh.after.color);
      eq('一行入口悬停不加 transform', mh.after.transform, 'none');
      ok('一行入口默认是 4/8 档', mh.before.shadow === SH_SM_LIGHT, mh.before.shadow);
    }
    // 三个入口同在一行、规则相同：逐个套镜像类确认底色一起浮出来。
    // 只量可用的那几个 —— n=0 的那几枚本来就压着 transparent（下面单独断言）。
    (function () {
      var host = mini ? mini.parentNode : null;
      var btns = host ? Array.prototype.slice.call(host.querySelectorAll('.btn--mini:not([disabled])')) : [];
      ok('入口行里至少有一枚可用', btns.length >= 1, '可用 ' + btns.length + ' 枚');
      var bgs = btns.map(function (b) { return hoverMeasure(b).after.bg; });
      ok('可用的入口悬停时一起浮出淡底',
        bgs.every(function (c) { return c === appVar('--bg-2'); }), bgs.join('|'));
    })();
    // 图标用 stroke="currentColor" 描边：跟文字同一个 color，所以会一起变深
    (function () {
      var icon = mini ? mini.querySelector('.mini-ico') : null;
      if (!icon) { ok('入口带内联图标', false); return; }
      var idle = getComputedStyle(icon).color;
      mini.classList.add('state-hover');
      var hot = getComputedStyle(icon).color;
      mini.classList.remove('state-hover');
      ok('入口图标跟着字色一起变深', idle !== hot && hot === appVar('--ink'),
        idle + ' → ' + hot);
    })();
    // 禁用态（n=0）不响应悬停：阴影、字色、底色、不透明度全都不变
    var off = q('.btn--mini[disabled]');
    if (off) {
      var oh = hoverMeasure(off);
      eq('禁用入口悬停无变化（阴影）', oh.after.shadow, oh.before.shadow);
      eq('禁用入口悬停无变化（字色）', oh.after.color, oh.before.color);
      eq('禁用入口悬停无变化（底色）', oh.after.bg, oh.before.bg);
      ok('禁用入口悬停底色仍是透明的', oh.after.bg === 'rgba(0, 0, 0, 0)', oh.after.bg);
      eq('禁用入口悬停无变化（不透明度）',
        getComputedStyle(off).opacity, '0.5');
    }

    // 清完存储后列表 DOM 还是旧的（本用例结束在列表页），进一轮再退出让它重画成空态
    clearQuizStorage();
    openBank('web');
    leaveQuiz();
    eq('悬停检查结束回到列表', text('.h1'), window.QuizCopy.LIST_TITLE);

  /* ================= 夜间模式（主题） ================= */
  var THEME_BG_LIGHT = 'rgb(224, 229, 236)';
  var THEME_BG_DARK = 'rgb(47, 51, 57)';
  var THEME_INK_DARK = 'rgb(232, 235, 240)';

  function themeOf() {
    return document.documentElement.getAttribute('data-theme');
  }

  /** 用户选的三态：system | light | dark（解析后的明暗在 data-theme 上） */
  function themeMode() {
    return document.documentElement.getAttribute('data-theme-mode');
  }

  function themeBtn() { return q('#btnTheme'); }

  function themeBtnText() { return themeBtn() ? themeBtn().textContent.trim() : ''; }

  function themeMenu() { return q('#themeMenu'); }

  function themeMenuOpen() { return !!themeMenu() && !themeMenu().hasAttribute('hidden'); }

  /** 打开菜单并返回三个选项按钮 */
  function openThemeMenu() {
    click(themeBtn());
    return qa('[data-theme-pick]');
  }

  /** 直接选某个模式（打开菜单 → 点那一项） */
  function pickTheme(mode) {
    var items = openThemeMenu();
    for (var i = 0; i < items.length; i++) {
      if (items[i].getAttribute('data-theme-pick') === mode) {
        click(items[i]);
        return true;
      }
    }
    return false;
  }

  function themeMenuLabels() {
    return qa('[data-theme-pick]').map(function (b) { return b.textContent.replace(/[\u2713\u2714]/g, '').trim(); });
  }

  function themeMenuChecked() {
    var out = [];
    qa('[data-theme-pick]').forEach(function (b) {
      if (b.getAttribute('aria-checked') === 'true') out.push(b.getAttribute('data-theme-pick'));
    });
    return out;
  }

  function bodyBg() { return getComputedStyle(document.body).backgroundColor; }

  function cssProp(sel, prop) {
    var e = q(sel);
    return e ? getComputedStyle(e)[prop] : '';
  }

  function themeStored() {
    var raw = localStorage.getItem(window.QuizTheme.KEY);
    if (!raw) return null;
    try { return JSON.parse(raw); } catch (e) { return 'BAD'; }
  }

  function rgbList(color) {
    var m = String(color).match(/\d+(\.\d+)?/g) || [];
    return [Number(m[0]) || 0, Number(m[1]) || 0, Number(m[2]) || 0];
  }

  function luminance(color) {
    var c = rgbList(color).map(function (v) {
      v = v / 255;
      return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
  }

  function contrastRatio(a, b) {
    var l1 = luminance(a);
    var l2 = luminance(b);
    var hi = Math.max(l1, l2);
    var lo = Math.min(l1, l2);
    return (hi + 0.05) / (lo + 0.05);
  }

  // 顶栏在窄屏下能不能放下（标题可以省略号截断，但按钮不许溢出）
  function topbarFitsAt(width) {
    var inner = q('.topbar__inner');
    if (!inner) return false;
    var prev = inner.style.width;
    inner.style.width = width + 'px';
    var fits = inner.scrollWidth <= width + 1;
    inner.style.width = prev;
    return fits;
  }

  // 深色下「背景深 + 文字浅」的通用检查
  function darkSurface(name, sel) {
    eq(name + '：背景是深色底', cssProp(sel, 'backgroundColor'), THEME_BG_DARK);
  }

  /**
   * 组件上有 300ms 的颜色过渡（--transition 里带 background-color），
   * 切换主题后立刻读 computedStyle 会读到过渡起点。断言的是「最终配色」，
   * 所以量颜色前先把过渡关掉，量完再打开（页面本身不动）。
   */
  function noTransitions() {
    if (document.getElementById('e2e-no-transition')) return;
    var s = document.createElement('style');
    s.id = 'e2e-no-transition';
    s.textContent = '*, *::before, *::after { transition: none !important }';
    document.head.appendChild(s);
  }

  function restoreTransitions() {
    var s = document.getElementById('e2e-no-transition');
    if (s && s.parentNode) s.parentNode.removeChild(s);
  }

  /* 「跟随系统」在这一台机器上会解析成什么：无头 Chrome 的 prefers-color-scheme 不一定是浅色，
     所以断言一律跟它比，而不是硬写 'light' */
  function sysTheme() {
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }

  /** 题号跳转：输入框 + 「跳」按钮、按本轮题序、非法输入给「1–y」提示 */
  /**
   * 题号跳转：同一个功能两副样子——窄屏是 meta 行里的小输入框 + 「跳」，
   * 宽屏（≥1080px）是右侧固定浮窗。两者都在 DOM 里，由 CSS 决定谁可见，
   * 所以这里两个分支的断言条数必须完全相等（否则 1440 与 1024 跑出的条数会不同）。
   */
  function runJumpChecks() {
    log('--- 题号跳转（meta 行 / 宽屏侧边浮窗）---');
    backToList();
    clearNormalProgress('web');
    openBank('web');
    goBack(1);
    eq('跳转检查从第 1 题开始', currentIndex(), 1);

    var wide = window.innerWidth >= 1080;
    var dock = q('.jump-dock');
    var metaJump = q('.meta__tools .jump');
    ok('两种形态都渲染了（谁可见交给 CSS）', !!dock && !!metaJump);
    ok('宽屏只显示侧边浮窗', wide === (!!dock && getComputedStyle(dock).display !== 'none'),
      'wide=' + wide + ' dock=' + (dock ? getComputedStyle(dock).display : '-'));
    ok('窄屏只显示 meta 行跳转', !wide === (!!metaJump && getComputedStyle(metaJump).display !== 'none'),
      'wide=' + wide + ' meta=' + (metaJump ? getComputedStyle(metaJump).display : '-'));

    if (wide) {
      var dr = dock.getBoundingClientRect();
      eq('浮窗宽 130px', Math.round(dr.width), 130);
      eq('浮窗是 fixed 定位（不参与文档流）', getComputedStyle(dock).position, 'fixed');
      var pageEl = q('.page--quiz');
      var contentRight = pageEl.getBoundingClientRect().right - parseFloat(getComputedStyle(pageEl).paddingRight);
      ok('浮窗在内容右缘之外至少 12px', dr.left >= contentRight + 12,
        'left=' + Math.round(dr.left) + ' contentRight=' + Math.round(contentRight));
      eq('浮窗贴着顶栏下方（top 96px）', Math.round(dr.top), 96);
      var dockInput = q('[data-jump-dock-input]');
      var dir = dockInput.getBoundingClientRect();
      eq('浮窗输入框 106×28', Math.round(dir.width) + 'x' + Math.round(dir.height), '106x28');
      eq('浮窗输入框是凹陷的', getComputedStyle(dockInput).boxShadow.indexOf('inset') !== -1, true);
      eq('浮窗输入框用数字键盘', dockInput.getAttribute('inputmode'), 'numeric');
      eq('浮窗按钮 28px 高', Math.round(q('.jump-dock__btn').getBoundingClientRect().height), 28);
      eq('浮窗按钮文案', q('.jump-dock__btn').textContent.trim(), window.QuizCopy.JUMP_DOCK_BTN);
    } else {
      var metaInput = q('[data-jump-input]');
      var mir = metaInput.getBoundingClientRect();
      eq('meta 输入框 56×28', Math.round(mir.width) + 'x' + Math.round(mir.height), '56x28');
      eq('meta 输入框是凹陷的', getComputedStyle(metaInput).boxShadow.indexOf('inset') !== -1, true);
      eq('输入框占位是「题号」', metaInput.getAttribute('placeholder'), window.QuizCopy.JUMP_PLACEHOLDER);
      eq('输入框用数字键盘', metaInput.getAttribute('inputmode'), 'numeric');
      eq('「跳」按钮 28px 高', Math.round(q('[data-act="jump"]').getBoundingClientRect().height), 28);
      eq('「跳」按钮文案', q('[data-act="jump"]').textContent.trim(), window.QuizCopy.JUMP_BTN);
      eq('「跳」按钮停在 4/8 一档', getComputedStyle(q('[data-act="jump"]')).boxShadow, SH_SM_LIGHT);
      var metaEl0 = q('.meta');
      var savedW0 = metaEl0.style.width;
      metaEl0.style.width = '343px';
      ok('375px 宽度下 meta 行不横向溢出', metaEl0.scrollWidth <= metaEl0.clientWidth + 1,
        'sw=' + metaEl0.scrollWidth + ' cw=' + metaEl0.clientWidth);
      metaEl0.style.width = savedW0;
      eq('meta 行里只有一处跳转输入框', document.querySelectorAll('[data-jump-input]').length, 1);
    }

    var inputSel = wide ? '[data-jump-dock-input]' : '[data-jump-input]';
    var btnSel = wide ? '[data-act="jump-dock"]' : '[data-act="jump"]';
    var hintSel = wide ? '[data-jump-dock-hint]' : '[data-jump-hint]';

    // 输入 5 + Enter
    q(inputSel).value = '5';
    q(inputSel).dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
    eq('输入 5 回车跳到第 5 题', currentIndex(), 5);
    // 两种形态唯一的行为差异：浮窗保留输入值，方便连跳
    eq(wide ? '浮窗跳完保留输入的题号' : 'meta 行跳完清空输入框', q(inputSel).value, wide ? '5' : '');
    eq('跳完不显示提示', q(hintSel).hidden, true);

    // 点按钮也能跳
    q(inputSel).value = '9';
    click(q(btnSel));
    eq('点按钮跳到第 9 题', currentIndex(), 9);
    eq('浮窗里的题号跟着当前题走', q('[data-jump-count]').textContent.trim(), '第 9/120 题');

    // 非法输入：0 / 超界 / 非数字 → 原地不动 + 提示区间
    ['0', '999', 'abc'].forEach(function (bad) {
      q(inputSel).value = bad;
      click(q(btnSel));
      eq('输入「' + bad + '」不跳题', currentIndex(), 9);
      var hint = q(hintSel);
      ok('输入「' + bad + '」给出区间提示', !!hint && !hint.hidden && hint.textContent === window.QuizCopy.JUMP_HINT(120),
        hint ? 'text=' + hint.textContent + ' hidden=' + hint.hidden : 'no hint');
      eq('提示是 11px', getComputedStyle(hint).fontSize, '11px');
      eq('提示用 --bad', getComputedStyle(hint).color, appVar('--bad'));
      var other = q(wide ? '[data-jump-hint]' : '[data-jump-dock-hint]');
      ok('另一形态的提示位没有被连带点亮', !!other && (other.hidden || other.textContent === ''),
        other ? 'hidden=' + other.hidden + ' text=' + other.textContent : 'missing');
    });
    q(inputSel).value = '';

    // 只读视图（历史快照）不给跳转、也不给收藏
    var roHtml = window.QuizViewQuiz.render({
      session: window.QuizApp.session(),
      readonly: true,
      starredOf: function () { return false; },
    });
    ok('只读视图不渲染跳转框（两种形态都没有）',
      roHtml.indexOf('data-jump-input') === -1 && roHtml.indexOf('data-jump-dock-input') === -1);
    ok('只读视图不渲染收藏星', roHtml.indexOf('data-star') === -1);

    backToList();
  }

  /* ================= 答题卡（题号网格） ================= */
  // 数一段 HTML 里某个片段出现了几次（只读视图没法挂进 DOM，直接数类名）
  function countOf(html, needle) {
    return html.split(needle).length - 1;
  }

  /**
   * 答题卡验收：219 题里答对 2 / 答错 1，网格 2 青 1 红、其余灰；
   * 统计算得出来；点格子跳题；四态底色各用各的令牌；数据异常题只多一个小点。
   */
  function runAnswerCardChecks() {
    log('--- 答题卡：宽屏侧边浮窗 ---');
    backToList();
    clearNormalProgress('java');
    openBank('java', 'all');
    eq('答题卡检查从 Java 全量 219 题开始', totalCount(), 219);
    goBack(1);
    eq('答题卡检查从第 1 题开始', currentIndex(), 1);

    // 对 2 错 1，停在第 3 题
    pickCorrect(); submitNow();
    click(q('[data-act="next"]'));
    pickCorrect(); submitNow();
    click(q('[data-act="next"]'));
    pickWrong(); submitNow();
    eq('答完三题停在第 3 题', currentIndex(), 3);
    var javaSession = window.QuizApp.session();
    eq('本轮判分 2 对 1 错', [javaSession.stats().correct, javaSession.stats().wrong], [2, 1]);

    var toggle = q('.jump-dock__overview');
    ok('宽屏浮窗里有「总览」按钮', !!toggle);
    eq('「总览」文案', toggle ? toggle.textContent.trim() : '', '总览');
    eq('默认收起：aria-expanded=false', toggle.getAttribute('aria-expanded'), 'false');
    ok('默认不显示答题卡', !visible(q('.jump-dock__card')));

    click(toggle);
    ok('点「总览」展开答题卡', visible(q('.jump-dock__card')));
    eq('展开后 aria-expanded=true', q('.jump-dock__overview').getAttribute('aria-expanded'), 'true');
    eq('展开后浮窗带 card-open 类', q('.jump-dock').classList.contains('jump-dock--card-open'), true);

    // 窄屏形态：宽屏下按钮藏起来、覆盖层不显示，但 DOM 里是同一份网格
    eq('窄屏「总览」按钮在宽屏隐藏', getComputedStyle(q('.card-toggle--meta')).display, 'none');
    ok('宽屏展开时覆盖层 markup 也在（跨断点不用换代码）', !!q('[data-card-overlay]'));
    eq('宽屏下覆盖层不显示', getComputedStyle(q('[data-card-overlay]')).display, 'none');
    eq('覆盖层是 dialog', q('#answerCardOverlay').getAttribute('role'), 'dialog');
    eq('覆盖层里也是 219 个格子', qa('#answerCardOverlay .answer-card__cell').length, 219);

    var cells = qa('.jump-dock .answer-card__cell');
    eq('格子数 = 本轮题数', cells.length, 219);
    // 浮窗只有 130px：统计拆成两行短句，各自单行；覆盖层仍是完整一句
    var dockStats = q('.jump-dock [data-answer-card-stats]');
    var dockLines = qa('.jump-dock .answer-card__stats-line');
    eq('浮窗统计是两行短句', dockLines.length, 2);
    eq('浮窗统计第一行', dockLines[0] ? dockLines[0].textContent.trim() : '', '未答 216');
    eq('浮窗统计第二行', dockLines[1] ? dockLines[1].textContent.trim() : '', '对 2 · 错 1');
    ok('浮窗统计第一行不折行', dockLines[0].getClientRects().length === 1,
      'rects=' + dockLines[0].getClientRects().length);
    ok('浮窗统计第二行不折行', dockLines[1].getClientRects().length === 1,
      'rects=' + dockLines[1].getClientRects().length);
    ok('浮窗统计两行总高不超过两行',
      dockStats.getBoundingClientRect().height <= 34, 'h=' + dockStats.getBoundingClientRect().height);
    eq('浮窗统计 12px', getComputedStyle(dockStats).fontSize, '12px');
    eq('浮窗统计用 --ink-3', getComputedStyle(dockStats).color, appVar('--ink-3'));
    eq('覆盖层统计仍是完整一句', text('#answerCardOverlay [data-answer-card-stats]'),
      '未答 216 · 答对 2 · 答错 1');
    ok('覆盖层统计单行不折',
      q('#answerCardOverlay [data-answer-card-stats]').getBoundingClientRect().height <= 18,
      'h=' + q('#answerCardOverlay [data-answer-card-stats]').getBoundingClientRect().height);

    ok('第 1 题格子是「已答对」', cells[0].classList.contains('answer-card__cell--correct'));
    ok('第 2 题格子是「已答对」', cells[1].classList.contains('answer-card__cell--correct'));
    ok('第 3 题格子是「已答错」', cells[2].classList.contains('answer-card__cell--wrong'));
    ok('答错的当前格保留错误底色（不隐藏状态）',
      getComputedStyle(cells[2]).backgroundColor === appVar('--bad'),
      'bg=' + getComputedStyle(cells[2]).backgroundColor);
    eq('当前格 aria-current=true', cells[2].getAttribute('aria-current'), 'true');
    eq('格子 aria-label = 题号 + 状态', cells[2].getAttribute('aria-label'), '第 3 题，已答错');
    ok('当前格带 --sh-focus 焦点环', getComputedStyle(cells[2]).boxShadow.indexOf('3px') !== -1,
      getComputedStyle(cells[2]).boxShadow);

    // 四态底色（当前格先挑未答题，见下面第 10 格）
    eq('已答对格子底色 --ok', getComputedStyle(cells[0]).backgroundColor, appVar('--ok'));
    eq('已答错格子底色 --bad', getComputedStyle(cells[2]).backgroundColor, appVar('--bad'));
    eq('未答格子底色 --mid', getComputedStyle(cells[3]).backgroundColor, appVar('--mid'));
    eq('未答格子字色 --ink-3', getComputedStyle(cells[3]).color, appVar('--ink-3'));
    eq('已答对格子字色 --on-ok', getComputedStyle(cells[0]).color, appVar('--on-ok'));
    eq('已答错格子字色 --on-accent', getComputedStyle(cells[2]).color, appVar('--on-accent'));

    var cellBox = cells[0].getBoundingClientRect();
    eq('格子 32×32', Math.round(cellBox.width) + 'x' + Math.round(cellBox.height), '32x32');
    eq('格子圆角 8px', getComputedStyle(cells[0]).borderRadius, '8px');
    var gridEl = q('.jump-dock .answer-card__grid');
    eq('格子间距 6px', getComputedStyle(gridEl).rowGap, '6px');
    eq('侧边网格最高 320px', getComputedStyle(gridEl).maxHeight, '320px');
    eq('侧边网格可纵向滚动', getComputedStyle(gridEl).overflowY, 'auto');
    ok('219 题装进 320px 里滚动', gridEl.scrollHeight > gridEl.clientHeight + 100,
      'sh=' + gridEl.scrollHeight + ' ch=' + gridEl.clientHeight);

    // 点第 10 个格子 → 跳第 10 题；宽屏保持展开
    click(cells[9]);
    eq('点第 10 个格子跳到第 10 题', currentIndex(), 10);
    ok('宽屏跳完仍展开', visible(q('.jump-dock__card')));
    var cells2 = qa('.jump-dock .answer-card__cell');
    eq('跳完格子数不变', cells2.length, 219);
    eq('新的当前格是第 10 题', cells2[9].getAttribute('aria-current'), 'true');
    eq('未答的当前格底色 --bg', getComputedStyle(cells2[9]).backgroundColor, appVar('--bg'));
    eq('未答的当前格字色 --ink', getComputedStyle(cells2[9]).color, appVar('--ink'));
    eq('统计行不随跳题变化', text('.jump-dock [data-answer-card-stats]').replace(/\s+/g, ''),
      '未答216对2·错1');
    ok('答题卡没有横向滚动', gridEl.scrollWidth <= gridEl.clientWidth + 1,
      'sw=' + gridEl.scrollWidth + ' cw=' + gridEl.clientWidth);
    ok('页面没有横向滚动',
      document.documentElement.scrollWidth <= document.documentElement.clientWidth + 1,
      'sw=' + document.documentElement.scrollWidth + ' cw=' + document.documentElement.clientWidth);
    var dockR = q('.jump-dock').getBoundingClientRect();
    var pageEl = q('.page--quiz');
    var contentRight = pageEl.getBoundingClientRect().right - parseFloat(getComputedStyle(pageEl).paddingRight);
    ok('展开后浮窗仍在内容右缘之外 ≥12px', dockR.left >= contentRight + 12,
      'left=' + Math.round(dockR.left) + ' contentRight=' + Math.round(contentRight));

    click(q('.jump-dock__overview'));
    ok('再点「总览」收起', !visible(q('.jump-dock__card')));
    eq('收起后 aria-expanded=false', q('.jump-dock__overview').getAttribute('aria-expanded'), 'false');
    ok('收起后覆盖层从 DOM 移除', !q('[data-card-overlay]'));

    /* ------------- 数据异常题：只多一个小点 ------------- */
    log('--- 答题卡：数据异常题右下角小点 ---');
    backToList();
    clearNormalProgress('web');
    openBank('web', 'all');
    goBack(1);
    click(q('.jump-dock__overview'));
    var webCells = qa('.jump-dock .answer-card__cell');
    eq('Web 格子数 = 120', webCells.length, 120);
    ok('Web #31 标了数据异常', webCells[30].classList.contains('answer-card__cell--invalid'));
    eq('数据异常题底色不变（仍是 --mid）', getComputedStyle(webCells[30]).backgroundColor, appVar('--mid'));
    var dot = getComputedStyle(webCells[30], '::after');
    eq('右下角小点 4px', dot.width, '4px');
    eq('小点用 --ink-3', dot.backgroundColor, appVar('--ink-3'));

    /* ------------- 只读快照：颜色照常、点击只跳不改判 ------------- */
    log('--- 答题卡：只读快照 ---');
    var roHtml = window.QuizViewQuiz.render({
      session: javaSession,
      readonly: true,
      starredOf: function () { return false; },
    });
    eq('只读视图格子数 = 本轮题数', countOf(roHtml, 'data-goto="'), 219);
    eq('只读视图照常标出 2 题答对', countOf(roHtml, 'answer-card__cell--correct'), 2);
    eq('只读视图照常标出 1 题答错', countOf(roHtml, 'answer-card__cell--wrong'), 1);
    ok('只读视图格子仍带 data-goto（只能跳、不能改判）', roHtml.indexOf('data-goto="9"') !== -1);
    ok('只读视图照常给状态 aria-label', roHtml.indexOf('aria-label="第 3 题，已答错"') !== -1);
    ok('只读视图不给跳转输入框',
      roHtml.indexOf('data-jump-input') === -1 && roHtml.indexOf('data-jump-dock-input') === -1);
    ok('只读视图不给收藏星', roHtml.indexOf('data-star') === -1);

    backToList();
    clearNormalProgress('web');
    clearNormalProgress('java');
  }

  /**
   * 可选服务端接入（js/core/api.js）在纯静态模式下的守门断言。
   * 这里跑在 file:// 下，所以只验「不发请求、不误判在线、字段映射正确」这几条；
   * 真正的在线路径靠 server/smoke.mjs 与浏览器联调覆盖。
   */
  function runApiChecks() {
    log('--- 可选服务端接入（file:// 下必须完全静默）---');
    var api = window.QuizApi;
    ok('加载了 QuizApi', !!api && typeof api === 'object');
    if (!api) return;

    eq('探活地址是相对路径', api.HEALTH_URL, 'api/health');
    eq('提交地址是相对路径', api.FEEDBACK_URL, 'api/feedback');
    eq('探活超时 1.2s', api.PROBE_TIMEOUT, 1200);

    eq('file:// 下不认为可以发请求', api.canRequest(), false);
    ok('file:// 下 probe() 返回 Promise 且立刻给 false', typeof api.probe() === 'object' && typeof api.probe().then === 'function');
    ok('probe 之后仍然不是在线状态（没有服务端）', api.online() === false);

    // 字段映射：前端的问题类型键要折成服务端的取值
    var payload = api.toPayload({
      bankKey: 'web',
      bankTitle: 'Web前端题库',
      questionId: 31,
      kind: 'option',
      note: 'x',
      picked: ['A'],
      answer: ['A', 'B'],
      page: 'result',
    });
    eq('kind 键折成中文取值', payload.kind, '选项有误');
    eq('picked 折成数组', payload.picked.join(','), 'A');
    eq('answer 折成数组', payload.answer.join(','), 'A,B');
    eq('questionId 折成数字', payload.questionId, 31);
    eq('未知 kind 落到「其他」', api.toPayload({ questionId: 1, kind: 'zzz' }).kind, '其他');
    eq('page 缺省是 quiz', api.toPayload({ questionId: 1 }).page, 'quiz');
  }

  /* ================= 入口 ================= */
  function finish() {
    log('');
    log('RESULT ' + (fail === 0 ? 'PASS' : 'FAIL') + '  pass=' + pass + ' fail=' + fail);
    document.getElementById('out').textContent = lines.join('\n');
  }

  document.addEventListener('DOMContentLoaded', function () {
    var hash = location.hash;
    try {
      if (hash === '#seed') {
        runRefreshWrite();
        finish();
        return;
      }
      if (hash === '#write') {
        runRefreshWrite();
        finish();
        return;
      }
      if (hash === '#check') {
        runRefreshCheck();
        finish();
        return;
      }
      if (hash === '#replay') {
        runReplayChecks();
        finish();
        return;
      }
      if (hash === '#replay-check') {
        runReplayRefreshCheck();
        finish();
        return;
      }
      if (hash === '#records') {
        runRecordsChecks();
        finish();
        return;
      }
      if (hash === '#records-check') {
        runRecordsRefreshCheck();
        finish();
        return;
      }
      if (hash === '#scope') {
        runScopeChecks();
        finish();
        return;
      }
      if (hash === '#scope-check') {
        runScopeRefreshCheck();
        finish();
        return;
      }
      if (hash === '#feedback') {
        runFeedbackChecks();
        finish();
        return;
      }
      if (hash === '#feedback-check') {
        runFeedbackRefreshCheck();
        finish();
        return;
      }
      if (hash === '#theme') {
        runThemeChecks();
        finish();
        return;
      }
      if (hash === '#theme-check') {
        runThemeRefreshCheck();
        finish();
        return;
      }
      if (hash === '#card') {
        // 答题卡单独跑：底色断言写的是浅色令牌，先显式设成亮色
        window.QuizTheme.apply(window.QuizTheme.save('light'));
        runAnswerCardChecks();
        finish();
        return;
      }
      if (hash === '#wrongbook') {
        runWrongbookChecks();
        runStarChecks();
        finish();
        return;
      }
      if (hash === '#stars') {
        runStarsWrite();
        finish();
        return;
      }
      if (hash === '#stars-check') {
        runStarsRefreshCheck();
        finish();
        return;
      }
      // 默认（含 #flow）：主流程 + Web 专项 + 题型徽标全量扫描 + 重练 + 练习记录 + 范围选择 + 错题本 + 收藏 + 反馈
      // 视觉断言写的是浅色规范里的具体数值，所以先显式设成「亮色」——这台机器的系统偏好可能是深色
      window.QuizTheme.apply(window.QuizTheme.save('light'));
      runFlow();
      runWebChecks();
      runTypeBadgeChecks();
      runReplayChecks();
      runRecordsChecks();
      runScopeChecks();
      runCountChecks();
      runBackChecks();
      runModifyChecks();
      runHoverChecks();
      runRecentChecks();
      runWrongbookChecks();
      runStarChecks();
      runFeedbackChecks();
      runLayoutChecks();
      runJumpChecks();
      runAnswerCardChecks();
      runApiChecks();
      finish();
    } catch (e) {
      log('EXCEPTION ' + (e && e.stack ? e.stack : e));
      fail++;
      finish();
    }
  });
})();
</script>

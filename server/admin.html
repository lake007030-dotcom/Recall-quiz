<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recall · 反馈管理后台</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 20px 64px;
    font: 15px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    background: #f6f7f9; color: #22262c;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { margin: 0 0 20px; color: #5b6371; font-size: 13px; }
  .card {
    background: #fff; border: 1px solid #e2e6ec; border-radius: 12px;
    padding: 18px 20px; margin-bottom: 16px;
  }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  input[type=password], select, button {
    font: inherit; padding: 8px 10px; border-radius: 8px;
    border: 1px solid #ccd3dd; background: #fff; color: inherit;
  }
  button { cursor: pointer; }
  button.primary { background: #6d5dfc; border-color: #6d5dfc; color: #fff; }
  button:disabled { opacity: .55; cursor: not-allowed; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #eceff3; vertical-align: top; }
  th { color: #5b6371; font-weight: 600; white-space: nowrap; }
  td.note { max-width: 320px; }
  .stem { color: #5b6371; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; background: #eceff3; color: #4b5563; }
  .badge.pending { background: #ede9ff; color: #4c3fd0; }
  .badge.handled { background: #e2f6f3; color: #1f6d64; }
  .badge.ignored { background: #f0f0f3; color: #6b7280; }
  .msg { font-size: 13px; margin: 10px 0 0; min-height: 20px; }
  .msg.error { color: #c0392b; }
  .msg.ok { color: #1f6d64; }
  .empty { color: #5b6371; font-size: 13px; padding: 12px 0; }
  @media (prefers-color-scheme: dark) {
    body { background: #24272c; color: #e8ebf0; }
    .card { background: #2c3036; border-color: #3b4149; }
    input[type=password], select, button { background: #2c3036; border-color: #4a515b; color: #e8ebf0; }
    th, td { border-color: #3b4149; }
    th, .sub, .stem, .empty { color: #9aa2ae; }
    .badge { background: #3b4149; color: #c6ccd6; }
  }
</style>
</head>
<body>

<h1>Recall · 反馈管理后台</h1>
<p class="sub">这个页面由可选的本地服务提供；纯静态模式（双击 index.html）没有它。</p>

<!-- 登录 -->
<section class="card" id="loginCard" hidden>
  <div class="row">
    <label for="token">管理员令牌</label>
    <input type="password" id="token" autocomplete="current-password" placeholder="粘贴 server/data/admin-token.txt 里的内容" style="min-width:320px">
    <button class="primary" id="loginBtn">登录</button>
  </div>
  <p class="msg" id="loginMsg"></p>
</section>

<!-- 反馈列表 -->
<section class="card" id="listCard" hidden>
  <div class="row" style="margin-bottom:14px">
    <select id="fBank"><option value="">全部题库</option></select>
    <select id="fKind">
      <option value="">全部类型</option>
      <option value="stem">题干有误</option>
      <option value="option">选项有误</option>
      <option value="answer">答案有误</option>
      <option value="explain">解析有误</option>
      <option value="other">其他</option>
    </select>
    <select id="fStatus">
      <option value="all">全部状态</option>
      <option value="pending">待处理</option>
      <option value="handled">已处理</option>
      <option value="ignored">已忽略</option>
    </select>
    <button id="refreshBtn">刷新</button>
    <a href="/api/export.csv"><button type="button">导出 CSV</button></a>
    <span class="empty" id="count"></span>
  </div>
  <p class="msg" id="listMsg"></p>
  <div id="tableWrap"></div>
</section>

<script>
(function () {
  'use strict';

  var loginCard = document.getElementById('loginCard');
  var listCard = document.getElementById('listCard');
  var loginMsg = document.getElementById('loginMsg');
  var listMsg = document.getElementById('listMsg');
  var tableWrap = document.getElementById('tableWrap');
  var countEl = document.getElementById('count');
  var fBank = document.getElementById('fBank');
  var fKind = document.getElementById('fKind');
  var fStatus = document.getElementById('fStatus');

  var STATUS_CN = { pending: '待处理', handled: '已处理', ignored: '已忽略' };

  function setMsg(el, text, ok) {
    el.textContent = text || '';
    el.className = 'msg' + (text ? (ok ? ' ok' : ' error') : '');
  }

  /** 统一取数据：返回 { status, data } */
  function call(method, url, body) {
    var opt = { method: method, headers: {}, credentials: 'same-origin' };
    if (body !== undefined && body !== null) {
      opt.headers['Content-Type'] = 'application/json';
      opt.body = JSON.stringify(body);
    }
    return fetch(url, opt).then(function (res) {
      var ct = res.headers.get('content-type') || '';
      if (ct.indexOf('application/json') >= 0) {
        return res.json().then(function (json) {
          return { status: res.status, data: json };
        });
      }
      return { status: res.status, data: null };
    });
  }

  function showLogin(show) {
    loginCard.hidden = !show;
    listCard.hidden = show;
  }

  /** 时间显示：2026-10-18T09:31:12.345Z → 2026-10-18 17:31 */
  function whenText(iso) {
    if (!iso) return '—';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return String(iso);
    function p(n) { return n < 10 ? '0' + n : String(n); }
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function cell(text, cls) {
    var td = document.createElement('td');
    if (cls) td.className = cls;
    td.textContent = text === null || text === undefined ? '' : String(text);
    return td;
  }

  /** 全部用 createElement + textContent 渲染：入库内容（备注、题干摘要）一律当纯文本 */
  function renderTable(items) {
    tableWrap.textContent = '';
    if (!items.length) {
      var empty = document.createElement('p');
      empty.className = 'empty';
      empty.textContent = '这个筛选下没有反馈。';
      tableWrap.appendChild(empty);
      return;
    }
    var table = document.createElement('table');
    var thead = document.createElement('thead');
    var htr = document.createElement('tr');
    ['时间', '题库', '题号', '类型', '摘要', '状态', '操作'].forEach(function (label) {
      var th = document.createElement('th');
      th.textContent = label;
      htr.appendChild(th);
    });
    thead.appendChild(htr);
    table.appendChild(thead);

    var tbody = document.createElement('tbody');
    items.forEach(function (item) {
      var tr = document.createElement('tr');
      tr.appendChild(cell(whenText(item.created_at)));
      tr.appendChild(cell(item.bank_title || item.bank_key));

      var idCell = document.createElement('td');
      idCell.textContent = '第 ' + item.question_id + ' 题';
      tr.appendChild(idCell);

      tr.appendChild(cell(item.kind));

      var noteCell = document.createElement('td');
      noteCell.className = 'note';
      // 反馈表里没有题干字段（不把题库内容搬进服务端），摘要就用说明 + 选择/答案
      var note = document.createElement('div');
      note.textContent = item.note || '（无备注）';
      noteCell.appendChild(note);
      var picks = [];
      if (item.picked) picks.push('我的选择 ' + item.picked);
      if (item.answer) picks.push('当前答案 ' + item.answer);
      if (picks.length) {
        var meta = document.createElement('div');
        meta.className = 'stem';
        meta.textContent = picks.join(' ｜ ');
        noteCell.appendChild(meta);
      }
      tr.appendChild(noteCell);

      var stCell = document.createElement('td');
      var badge = document.createElement('span');
      badge.className = 'badge ' + (item.status || 'pending');
      badge.textContent = STATUS_CN[item.status] || item.status || '待处理';
      stCell.appendChild(badge);
      tr.appendChild(stCell);

      var actCell = document.createElement('td');
      ['handled', 'ignored'].forEach(function (st) {
        if (item.status === st) return;
        var btn = document.createElement('button');
        btn.textContent = st === 'handled' ? '标记已处理' : '忽略';
        btn.style.marginRight = '6px';
        btn.addEventListener('click', function () {
          btn.disabled = true;
          call('POST', '/api/feedback/' + encodeURIComponent(item.id) + '/handle', { status: st })
            .then(function (r) {
              if (r.status === 200) load();
              else {
                btn.disabled = false;
                setMsg(listMsg, (r.data && r.data.error) || ('处理失败（HTTP ' + r.status + '）'), false);
              }
            })
            .catch(function () {
              btn.disabled = false;
              setMsg(listMsg, '网络错误，请重试', false);
            });
        });
        actCell.appendChild(btn);
      });
      tr.appendChild(actCell);

      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    tableWrap.appendChild(table);
  }

  /** 银行下拉按已出现的题库补全，不额外加接口 */
  function fillBanks(items) {
    var seen = {};
    for (var i = 0; i < fBank.options.length; i++) seen[fBank.options[i].value] = true;
    items.forEach(function (item) {
      var key = item.bank_key;
      if (!key || seen[key]) return;
      seen[key] = true;
      var opt = document.createElement('option');
      opt.value = key;
      opt.textContent = item.bank_title || key;
      fBank.appendChild(opt);
    });
  }

  function query() {
    var parts = [];
    parts.push('status=' + encodeURIComponent(fStatus.value || 'all'));
    if (fBank.value) parts.push('bank=' + encodeURIComponent(fBank.value));
    if (fKind.value) parts.push('kind=' + encodeURIComponent(fKind.value));
    return '/api/feedback?' + parts.join('&');
  }

  function load() {
    setMsg(listMsg, '');
    return call('GET', query())
      .then(function (r) {
        if (r.status === 401) {
          showLogin(true);
          return;
        }
        if (r.status !== 200 || !r.data || !r.data.ok) {
          setMsg(listMsg, (r.data && r.data.error) || ('读取失败（HTTP ' + r.status + '）'), false);
          return;
        }
        showLogin(false);
        fillBanks(r.data.items || []);
        renderTable(r.data.items || []);
        countEl.textContent = '共 ' + r.data.total + ' 条' + (r.data.total >= 500 ? '（最多显示 500 条）' : '');
      })
      .catch(function () {
        setMsg(listMsg, '网络错误，请确认服务仍在运行', false);
      });
  }

  document.getElementById('loginBtn').addEventListener('click', function () {
    var btn = this;
    var token = document.getElementById('token').value.trim();
    if (!token) {
      setMsg(loginMsg, '请先填入令牌', false);
      return;
    }
    btn.disabled = true;
    setMsg(loginMsg, '');
    call('POST', '/admin/login', { token: token })
      .then(function (r) {
        btn.disabled = false;
        if (r.status === 200) {
          document.getElementById('token').value = '';
          setMsg(loginMsg, '');
          load();
        } else {
          setMsg(loginMsg, (r.data && r.data.error) || ('登录失败（HTTP ' + r.status + '）'), false);
        }
      })
      .catch(function () {
        btn.disabled = false;
        setMsg(loginMsg, '网络错误，请重试', false);
      });
  });

  document.getElementById('token').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') document.getElementById('loginBtn').click();
  });

  document.getElementById('refreshBtn').addEventListener('click', load);
  [fBank, fKind, fStatus].forEach(function (el) {
    el.addEventListener('change', load);
  });

  load();
})();
</script>
</body>
</html>
